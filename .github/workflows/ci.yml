name: React JSX CI

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ./endurance-matrix

jobs:
  build:
    # Uses the latest Ubuntu virtual environment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm" # Options: 'npm', 'yarn', or 'pnpm'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run linter (optional, highly recommended for JSX verification)
      - name: Run linter
        run: npm run lint
        continue-on-error: true # Prevents pipeline from breaking if lint rules fail

      # Step 5: Compile and build the JSX/React application
      - name: Build application
        run: npm run build
